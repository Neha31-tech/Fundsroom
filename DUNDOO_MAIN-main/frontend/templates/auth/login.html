<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dundoo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/unified_auth.css') }}">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <div class="auth-header">
        <a href="/" class="auth-brand"><i class="fa-solid fa-shop"></i> Dundoo</a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Login to your account to continue.</p>
      </div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-user" onclick="switchTab('user')">Customer</button>
        <button class="auth-tab" id="tab-shop" onclick="switchTab('shop')">Shop Owner</button>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <!-- USER LOGIN FORM -->
      <form id="form-user" method="post" action="{{ url_for('user.login') }}" style="display: block;">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Your username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="user_password">Password</label>
          <input type="password" id="user_password" name="password" class="form-input" placeholder="Your password" required>
        </div>

        <button type="submit" class="btn-primary">Login as Customer</button>
        <div class="auth-footer">
          New customer? <a href="{{ url_for('user.register') }}">Create an account</a>
        </div>
      </form>

      <!-- SHOP LOGIN FORM -->
      <form id="form-shop" method="post" action="{{ url_for('shop.login') }}" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="shop_name">Shop name or Email</label>
          <input type="text" id="shop_name" name="shop_name" class="form-input" placeholder="RR Bakery or you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="shop_password">Password</label>
          <input type="password" id="shop_password" name="password" class="form-input" placeholder="Enter your shop password" required>
        </div>

        <button type="submit" class="btn-primary">Login to Shop Dashboard</button>
        <div class="auth-footer">
          New shop? <a href="{{ url_for('shop.register') }}">Register your shop</a>
        </div>
      </form>

    </div>
  </div>

  <script>
    function switchTab(type) {
      if (type === 'user') {
        document.getElementById('tab-user').classList.add('active');
        document.getElementById('tab-shop').classList.remove('active');
        document.getElementById('form-user').style.display = 'block';
        document.getElementById('form-shop').style.display = 'none';
        history.replaceState(null, '', '{{ url_for("user.login") }}');
      } else {
        document.getElementById('tab-shop').classList.add('active');
        document.getElementById('tab-user').classList.remove('active');
        document.getElementById('form-shop').style.display = 'block';
        document.getElementById('form-user').style.display = 'none';
        history.replaceState(null, '', '{{ url_for("shop.login") }}');
      }
    }

    // Auto-select tab based on current URL path
    window.onload = function() {
      if (window.location.pathname.includes('/shop/login')) {
        switchTab('shop');
      } else {
        switchTab('user');
      }
    };
  </script>

</body>
</html>
